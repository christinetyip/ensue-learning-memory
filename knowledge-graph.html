        const width = window.innerWidth;
        const height = window.innerHeight;

        let showLabels = true;

        const svg = d3.select('#graph')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        // Add zoom behavior
        const g = svg.append('g');

        const zoom = d3.zoom()
            .scaleExtent([0.2, 4])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });

        svg.call(zoom);

        // Initial zoom to fit
        svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.8));

        // Create force simulation
        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.links)
                .id(d => d.id)
                .distance(d => d.type === 'related' ? 150 : 80)
                .strength(d => d.strength || 0.5))
            .force('charge', d3.forceManyBody()
                .strength(d => d.type === 'category' ? -400 : d.type === 'subcategory' ? -200 : -100))
            .force('center', d3.forceCenter(0, 0))
            .force('collision', d3.forceCollide().radius(d => d.size + 30));

        // Draw links
        const link = g.append('g')
            .selectAll('line')
            .data(graphData.links)
            .join('line')
            .attr('stroke', d => d.type === 'related' ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.15)')
            .attr('stroke-width', d => d.type === 'related' ? 1 : 1.5);

        // Draw nodes
        const node = g.append('g')
            .selectAll('g')
            .data(graphData.nodes)
            .join('g')
            .attr('class', 'node')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));

        // Node circles
        node.append('circle')
            .attr('r', d => d.size)
            .attr('fill', d => d.color)
            .attr('stroke', '#fff')
            .attr('stroke-width', d => d.type === 'category' ? 3 : d.type === 'subcategory' ? 2 : 1)
            .attr('stroke-opacity', 0.3)
            .style('cursor', 'pointer')
            .on('mouseover', showTooltip)
            .on('mouseout', hideTooltip)
            .on('click', focusNode);

        // Node labels
        const labels = node.append('text')
            .attr('class', d => 'node-label ' + d.type)
            .attr('dy', d => d.size + 14)
            .attr('text-anchor', 'middle')
            .text(d => {
                const name = d.name;
                return name.length > 20 ? name.substring(0, 18) + '...' : name;
            });

        // Simulation tick
        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        // Drag functions
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }

        // Tooltip
        function showTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            tooltip.innerHTML = `
                <h3>${d.name}</h3>
                <div class="type">${d.type}</div>
                ${d.description ? '<p>' + d.description + '</p>' : ''}
            `;
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 10) + 'px';
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('visible');
        }

        // Focus on node
        function focusNode(event, d) {
            const scale = 1.5;
            svg.transition()
                .duration(500)
                .call(zoom.transform, d3.zoomIdentity
                    .translate(width / 2 - d.x * scale, height / 2 - d.y * scale)
                    .scale(scale));
        }

        // Reset view
        function resetView() {
            svg.transition()
                .duration(500)
                .call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.8));
        }

        // Toggle labels
        function toggleLabels() {
            showLabels = !showLabels;
            labels.style('opacity', showLabels ? 1 : 0);
        }

        // Search
        function searchNodes(query) {
            const q = query.toLowerCase().trim();

            node.select('circle')
                .attr('opacity', d => {
                    if (!q) return 1;
                    const match = d.name.toLowerCase().includes(q) ||
                                  (d.description && d.description.toLowerCase().includes(q));
                    return match ? 1 : 0.1;
                });

            labels.attr('opacity', d => {
                if (!showLabels) return 0;
                if (!q) return 1;
                const match = d.name.toLowerCase().includes(q) ||
                              (d.description && d.description.toLowerCase().includes(q));
                return match ? 1 : 0.1;
            });

            link.attr('opacity', d => {
                if (!q) return 1;
                const sourceMatch = d.source.name.toLowerCase().includes(q);
                const targetMatch = d.target.name.toLowerCase().includes(q);
                return (sourceMatch || targetMatch) ? 0.5 : 0.05;
            });
        }

        // Handle resize
        window.addEventListener('resize', () => {
            svg.attr('width', window.innerWidth).attr('height', window.innerHeight);
        });
    </script>
